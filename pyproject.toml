[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "code-explain"
version = "0.2.0"
description = "A local, RAG-powered CLI that indexes a codebase and answers questions about it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Grace Leverett" }]
keywords = ["rag", "codebase", "ollama", "cli", "code-search", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Documentation",
]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "ollama>=0.3",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.14",
    "sqlite-vec>=0.1.9",
    "pathspec>=0.12",
]

[project.optional-dependencies]
# For users on the macOS *system* Python, whose sqlite3 lacks loadable-extension
# support (needed by sqlite-vec). Homebrew Python and Linux users do not need this.
macos-system-python = [
    "pysqlite3-binary>=0.5",
]
# Alternative vector backend (LanceDB). sqlite-vec remains the default.
lancedb = [
    "lancedb>=0.10",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]

[project.scripts]
code-explain = "code_explain.cli:app"

[project.urls]
Homepage = "https://github.com/gvleverett/codebase-explainer-agent"
Repository = "https://github.com/gvleverett/codebase-explainer-agent"
Issues = "https://github.com/gvleverett/codebase-explainer-agent/issues"
Changelog = "https://github.com/gvleverett/codebase-explainer-agent/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/code_explain"]

[tool.hatch.build.targets.sdist]
include = ["src/code_explain", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"